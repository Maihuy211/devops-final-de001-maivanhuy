name: CI/CD - Build and Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: mhuy211/devops-pratice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Spring Boot
        run: chmod +x gradlew && ./gradlew clean bootJar -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 5m
          envs: MYSQL_ROOT_PASSWORD, GITHUB_TOKEN
          script: |
            set -e

            echo "STEP 1: SSH CONNECTED"
            whoami
            hostname

            echo "STEP 2: ENTER PROJECT"
            mkdir -p ~/devops-pratice
            cd ~/devops-pratice
            if [ ! -d "devops-practice" ]; then
              echo "Cloning repository..."
              git clone https://${GITHUB_TOKEN}@github.com/mhuy211/devops-final-de001-maivanhuy.git devops-practice
            fi
            cd ~/devops-pratice/devops-practice

            echo "STEP 3: GIT PULL"
            GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main

            echo "STEP 4: CREATE ENV"
            cat > .env <<EOF
            DOCKERHUB_USERNAME=mhuy211
            DOCKERHUB_REPOSITORY=devops-pratice
            IMAGE_TAG=latest
            MYSQL_DATABASE=db_test
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            APP_HOST_PORT=80
            MYSQL_HOST_PORT=3306
            EOF

            chmod 600 .env

            echo "STEP 5: DOCKER PULL"
            docker compose pull backend

            echo "STEP 6: DOCKER DEPLOY"
            docker compose up -d --remove-orphans

            echo "STEP 7: CHECK CONTAINERS"
            docker ps
            docker logs --tail=80 devops-backend

            echo "DEPLOY COMPLETED"
